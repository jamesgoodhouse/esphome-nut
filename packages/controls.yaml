# Optional: let Home Assistant change UPS settings. Use together with ups.yaml:
#
#   packages:
#     ups: github://jamesgoodhouse/esphome-nut/packages/ups.yaml@main
#     controls: github://jamesgoodhouse/esphome-nut/packages/controls.yaml@main
#
# Adds a beeper switch, a "mute alarm" button, a battery self-test button and the self-test result.
# NUT clients can run the same commands only if their user has `allow_commands: true` under nut_server.

ups_hid:
  allow_control: true

switch:
  - platform: ups_hid
    id: ups_switches
    beeper:
      id: ups_beeper
      name: Beeper

button:
  - platform: ups_hid
    id: ups_buttons
    mute_beeper:
      id: ups_mute_beeper
      name: Mute alarm
    battery_self_test:
      id: ups_battery_self_test
      name: Battery self-test

text_sensor:
  - platform: ups_hid
    id: ups_control_text_sensors
    self_test_result:
      id: ups_self_test_result
      name: Self-test result
