# Ready-made UPS monitor: reads the USB UPS, serves it to NUT clients, and exposes every
# value as an ESPHome entity. Include it with:
#
#   packages:
#     ups: github://jamesgoodhouse/esphome-nut/packages/ups.yaml@main
#
# Entities are named plainly ("Battery charge"); Home Assistant shows them under the device name.
#
# Customise from your own config:
#   nut_server:
#     synology_compatible: true       # any nut_server / ups_hid option can be added
#   sensor:
#     - id: !extend ups_sensors
#       wall_frequency: !remove       # drop an entity you don't want
#       load_percent:
#         name: UPS load              # rename one
#   nut_server: !remove               # sensors only, no NUT server
#
# Developing locally? Add your own external_components entry with `type: local`;
# it takes precedence over the GitHub copy below.

external_components:
  - source: github://jamesgoodhouse/esphome-nut@main

ups_hid:
  id: ups

nut_server:

sensor:
  - platform: ups_hid
    id: ups_sensors
    battery_charge:
      id: ups_battery_charge
      name: Battery charge
    battery_runtime_remaining:
      id: ups_battery_runtime_remaining
      name: Battery runtime remaining
    battery_voltage:
      id: ups_battery_voltage
      name: Battery voltage
    wall_voltage:
      id: ups_wall_voltage
      name: Wall voltage
    output_voltage:
      id: ups_output_voltage
      name: Output voltage
    wall_frequency:
      id: ups_wall_frequency
      name: Wall frequency
    load_percent:
      id: ups_load_percent
      name: Load

binary_sensor:
  - platform: ups_hid
    id: ups_binary_sensors
    ups_connected:
      id: ups_connected
      name: UPS connected
    on_battery:
      id: ups_on_battery
      name: On battery
    charging:
      id: ups_charging
      name: Charging
    low_battery:
      id: ups_low_battery
      name: Low battery
    battery_needs_replacement:
      id: ups_battery_needs_replacement
      name: Battery needs replacement
    overloaded:
      id: ups_overloaded
      name: Overloaded

text_sensor:
  - platform: ups_hid
    id: ups_text_sensors
    status:
      id: ups_status
      name: Status
    status_code:
      id: ups_status_code
      name: Status code
    manufacturer:
      id: ups_manufacturer
      name: Manufacturer
    model:
      id: ups_model
      name: Model
    serial_number:
      id: ups_serial_number
      name: Serial number
