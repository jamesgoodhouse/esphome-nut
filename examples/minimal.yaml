# The smallest useful setup: a NUT server for a USB UPS, plus ESPHome entities for every value.
# NUT clients (Linux upsmon, TrueNAS, Home Assistant, ...) connect to ups@<this device's IP>.
# Home Assistant is not required.

esphome:
  name: ups-nut

esp32:
  board: esp32-s3-devkitc-1  # needs an ESP32-S2, S3 or P4 (a chip with USB host support)

packages:
  ups: github://jamesgoodhouse/esphome-nut/packages/ups.yaml@main

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome

nut_server:
  users:
    - username: upsmon
      password: !secret nut_password
      role: primary  # the one machine allowed to tell everyone else to shut down
